<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0e4d7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* ФОНОВИЙ КОНТЕЙНЕР */
        .unicorns-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .char-svg {
            position: absolute;
            width: 130px;
            height: 100px;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.12));
        }

        /* --- АНІМАЦІЯ КІНЦІВОК ТА КРИЛ --- */
        
        .leg-front-1 {
            transform-origin: 45px 75px;
            animation: legGallop 0.35s ease-in-out infinite alternate;
        }
        .leg-front-2 {
            transform-origin: 55px 75px;
            animation: legGallop 0.35s ease-in-out infinite alternate-reverse;
        }
        .leg-back-1 {
            transform-origin: 90px 75px;
            animation: legGallop 0.35s ease-in-out infinite alternate-reverse;
        }
        .leg-back-2 {
            transform-origin: 98px 75px;
            animation: legGallop 0.35s ease-in-out infinite alternate;
        }

        @keyframes legGallop {
            0% { transform: rotate(-22deg); }
            100% { transform: rotate(25deg); }
        }

        .wing {
            transform-origin: 75px 58px;
            animation: wingFlap 0.3s ease-in-out infinite alternate;
        }

        @keyframes wingFlap {
            0% { transform: rotate(-15deg) scaleY(1); }
            100% { transform: rotate(35deg) scaleY(0.6); }
        }

        .body-bounce {
            transform-origin: center;
            animation: bodyBounce 0.35s ease-in-out infinite alternate;
        }

        @keyframes bodyBounce {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(-2deg); }
        }

        /* --- АНІМАЦІЇ РУХУ ПО ЕКРАНУ --- */
        @keyframes runLeftToRight {
            0% { transform: translateX(-180px); }
            100% { transform: translateX(110vw); }
        }

        @keyframes runRightToLeft {
            0% { transform: translateX(110vw) scaleX(-1); }
            100% { transform: translateX(-180px) scaleX(-1); }
        }

        /* Позиціонування 12 персонажів із від'ємними затримками для негайного розкиду */
        .u1  { top: 2%;  animation: runLeftToRight 6.5s linear infinite -1.2s; }
        .u2  { top: 10%; animation: runRightToLeft 8.5s linear infinite -4.0s; }
        .u3  { top: 18%; animation: runLeftToRight 7.2s linear infinite -2.5s; }
        .u4  { top: 27%; animation: runRightToLeft 9.0s linear infinite -6.1s; }
        .u5  { top: 36%; animation: runLeftToRight 6.0s linear infinite -0.8s; }
        .u6  { top: 45%; animation: runRightToLeft 8.0s linear infinite -3.2s; }
        .u7  { top: 54%; animation: runLeftToRight 7.8s linear infinite -5.4s; }
        .u8  { top: 63%; animation: runRightToLeft 9.2s linear infinite -1.9s; }
        .u9  { top: 72%; animation: runLeftToRight 6.8s linear infinite -4.7s; }
        .u10 { top: 81%; animation: runRightToLeft 8.2s linear infinite -2.1s; }
        .u11 { top: 89%; animation: runLeftToRight 7.5s linear infinite -0.5s; }
        .u12 { top: 40%; animation: runLeftToRight 11s  linear infinite -7.3s; }

        .book {
            position: relative;
            width: min(90vw, 900px);
            aspect-ratio: 2400 / 800;
            perspective: 2000px;
            cursor: pointer;
            transition: transform 0.5s ease;
            z-index: 5;
        }

        .page-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            box-shadow: 5px 15px 35px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }

        .page-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-turn {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            z-index: 10;
        }

        .book.open .cover-turn {
            transform: rotateY(-180deg);
        }

        .cover-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        .cover-front {
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }

        .cover-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-back {
            transform: rotateY(180deg);
            background-color: #ffe7fb;
            box-shadow: -5px 15px 35px rgba(0, 0, 0, 0.15);
        }

        #spiral-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .spiral-ribbon {
            position: absolute;
            top: -80px;
            animation: fallAndSpin 4.5s linear forwards;
        }

        @keyframes fallAndSpin {
            0% {
                transform: translateY(0) rotate(0deg) scaleY(0.5);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translateY(10vh) rotate(35deg) scaleY(1);
            }
            100% {
                transform: translateY(115vh) rotate(540deg) scaleY(1);
                opacity: 0.15;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body { 
                padding: 0; 
            }

            .book {
                transform: rotate(90deg);
                width: min(80vh, 550px);
                aspect-ratio: 2400 / 800;
            }

            .unicorns-background,
            #spiral-container {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
                top: calc(50% - 50vw);
                left: calc(50% - 50vh);
            }
        }
    </style>
</head>

        <div class="page-right">
            <img src="inside.jpg" alt="Запрошення">
        </div>

        <div class="cover-turn">
            <div class="cover-face cover-front">
                <img src="cover.jpg" alt="Обкладинка">
            </div>
            <div class="cover-face cover-back"></div>
        </div>
    </div>

    <script>
        const book = document.getElementById('book');
        const spiralContainer = document.getElementById('spiral-container');

        // Зменшена та коротка серпантинова стрічка
        function createSpiralRibbon() {
            const colors = ['#e63946', '#ffb703', '#00b4d8', '#d62828', '#7209b7', '#4361ee', '#f72585'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * 95; 
            const scale = 0.5 + Math.random() * 0.4; // Зменшений масштаб

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 30 130");
            svg.setAttribute("width", (30 * scale).toString());
            svg.setAttribute("height", (130 * scale).toString());
            svg.classList.add("spiral-ribbon");
            svg.style.left = left + "vw";
            svg.style.animationDuration = (3.5 + Math.random() * 2) + "s";

            // Коротший та витончений вигин
            svg.innerHTML = `
                <path d="M15 0 
                         C 28 15, 28 30, 15 45 
                         C 2 60, 2 75, 15 90 
                         C 28 105, 28 120, 15 130" 
                      fill="none" 
                      stroke="${color}" 
                      stroke-width="4.5" 
                      stroke-linecap="round"/>
            `;

            spiralContainer.appendChild(svg);
            setTimeout(() => svg.remove(), 5500);
        }

        function launchSuperEffects() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;

            const spiralInterval = setInterval(() => {
                if (Date.now() > animationEnd) return clearInterval(spiralInterval);
                createSpiralRibbon();
            }, 140);

            const colors = ['#ffffff', '#ffd700', '#ff0055', '#00e5ff', '#ffbe0b', '#8338ec', '#ff70a6'];

            const confettiInterval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(confettiInterval);

                confetti({
                    particleCount: 25,
                    startVelocity: 20,
                    spread: 360,
                    ticks: 200,
                    origin: { x: Math.random(), y: Math.random() * 0.8 },
                    colors: ['#ffffff', '#fff3b0', '#ffd700'],
                    shapes: ['star'],
                    scalar: 0.45,
                    gravity: 0.4,
                    drift: (Math.random() - 0.5) * 1.5
                });

                confetti({
                    particleCount: 20,
                    startVelocity: 45,
                    spread: 100,
                    origin: { x: Math.random(), y: 0.5 },
                    colors: colors,
                    scalar: 1.2,
                    ticks: 250
                });
            }, 80);
        }

        book.addEventListener('click', () => {
            const isOpen = book.classList.toggle('open');
            if (isOpen) {
                launchSuperEffects();
            }
        });
    </script>
