<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0e4d7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* КОНТЕЙНЕР ДЛЯ ФОНОВИХ ЄДИНОРОГІВ ТА ПЕГАСІВ */
        .unicorns-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1; /* Знаходиться під листівкою */
            overflow: hidden;
        }

        /* Базовий стиль для кожного персонажа */
        .unicorn-runner {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0.85;
        }

        /* Анімації руху */
        @keyframes runLeftToRight {
            0% { transform: translateX(-150px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-15px); }
            100% { transform: translateX(110vw) translateY(0); }
        }

        @keyframes runRightToLeft {
            0% { transform: translateX(110vw) scaleX(-1) translateY(0); }
            50% { transform: translateX(50vw) scaleX(-1) translateY(-20px); }
            100% { transform: translateX(-150px) scaleX(-1) translateY(0); }
        }

        /* Позиціонування та індивідуальні налаштування 8 персонажів */
        .u1 { top: 8%; animation: runLeftToRight 8s linear infinite; }
        .u2 { top: 22%; animation: runRightToLeft 10s linear infinite 1s; }
        .u3 { top: 38%; animation: runLeftToRight 7s linear infinite 2s; }
        .u4 { top: 52%; animation: runRightToLeft 9s linear infinite 0.5s; }
        .u5 { top: 68%; animation: runLeftToRight 11s linear infinite 3s; }
        .u6 { top: 80%; animation: runRightToLeft 8.5s linear infinite 1.5s; }
        .u7 { top: 15%; animation: runLeftToRight 12s linear infinite 4s; }
        .u8 { top: 75%; animation: runRightToLeft 7.5s linear infinite 3.5s; }

        .book {
            position: relative;
            width: min(90vw, 900px);
            aspect-ratio: 2400 / 800;
            perspective: 2000px;
            cursor: pointer;
            transition: transform 0.5s ease;
            z-index: 5; /* Листівка поверх єдинорогів */
        }

        .page-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            box-shadow: 5px 15px 35px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }

        .page-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-turn {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            z-index: 10;
        }

        .book.open .cover-turn {
            transform: rotateY(-180deg);
        }

        .cover-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        .cover-front {
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }

        .cover-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-back {
            transform: rotateY(180deg);
            background-color: #ffe7fb;
            box-shadow: -5px 15px 35px rgba(0, 0, 0, 0.15);
        }

        .hint {
            margin-top: 30px;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            text-align: center;
            transition: transform 0.5s ease;
            z-index: 5;
        }

        #spiral-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .spiral-ribbon {
            position: absolute;
            top: -150px;
            animation: fallAndSpin 5s linear forwards;
        }

        @keyframes fallAndSpin {
            0% {
                transform: translateY(0) rotate(0deg) scaleY(0.3);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translateY(15vh) rotate(45deg) scaleY(1);
            }
            100% {
                transform: translateY(115vh) rotate(720deg) scaleY(1.1);
                opacity: 0.2;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body { padding: 0; }
            .book {
                transform: rotate(90deg);
                width: min(85vh, 600px);
                aspect-ratio: 2400 / 800;
            }
            .hint {
                transform: rotate(90deg);
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ФОНОВІ ЄДИНОРОГИ ТА ПЕГАСИ (8 ШТУК) -->
    <div class="unicorns-background">
        <!-- SVG Шаблони персонажів -->
        <svg class="unicorn-runner u1" viewBox="0 0 100 100">
            <!-- Тіло та голова -->
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 C 75 50, 65 52, 60 60 C 55 70, 40 75, 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <!-- Ріг -->
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <!-- Грива та хвіст (Райдужні) -->
            <path d="M 68 28 Q 60 20 52 35 Q 45 25 40 42" fill="none" stroke="#ff4b91" stroke-width="4" stroke-linecap="round"/>
            <path d="M 65 32 Q 58 24 50 38" fill="none" stroke="#ffb84c" stroke-width="3"/>
            <path d="M 62 35 Q 55 27 48 42" fill="none" stroke="#4d96ff" stroke-width="3"/>
            <path d="M 22 62 Q 10 65 5 75 Q 12 80 18 72" fill="#ff4b91" stroke="#2b2b2b" stroke-width="1.5"/>
            <!-- Око та мордочка -->
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <!-- Ноги -->
            <path d="M 30 70 L 25 90 M 38 72 L 42 90 M 50 68 L 48 90 M 58 63 L 65 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <svg class="unicorn-runner u2" viewBox="0 0 100 100">
            <!-- Пегас з крилами -->
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 C 75 50, 65 52, 60 60 C 55 70, 40 75, 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <!-- Крило -->
            <path d="M 45 48 C 35 25, 15 20, 25 40 C 30 45, 40 50, 48 52 Z" fill="#fff5fa" stroke="#2b2b2b" stroke-width="2"/>
            <path d="M 22 62 Q 10 65 5 75 Q 12 80 18 72" fill="#6bc24a" stroke="#2b2b2b" stroke-width="1.5"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 20 85 M 38 72 L 32 88 M 50 68 L 55 88 M 58 63 L 70 85" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <svg class="unicorn-runner u3" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 C 75 50, 65 52, 60 60 C 55 70, 40 75, 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <path d="M 68 28 Q 60 20 52 35 Q 45 25 40 42" fill="none" stroke="#9b5de5" stroke-width="4"/>
            <path d="M 22 62 Q 10 65 5 75" fill="none" stroke="#f15bb5" stroke-width="3"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 25 90 M 38 72 L 42 90 M 50 68 L 48 90 M 58 63 L 65 90" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>

        <svg class="unicorn-runner u4" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 Q 45 50 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <path d="M 45 48 C 30 15, 10 15, 20 38 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 22 86 M 38 72 L 35 88 M 50 68 L 52 88 M 58 63 L 68 86" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>

        <svg class="unicorn-runner u5" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 C 75 50, 65 52, 60 60 C 55 70, 40 75, 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <path d="M 68 28 Q 60 20 52 35" fill="none" stroke="#00bbf9" stroke-width="4"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 25 90 M 38 72 L 42 90 M 50 68 L 48 90 M 58 63 L 65 90" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>

        <svg class="unicorn-runner u6" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 C 85 25, 88 35, 80 45 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <path d="M 45 48 C 35 25, 15 20, 25 40 Z" fill="#fff5fa" stroke="#2b2b2b" stroke-width="2"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 20 85 M 38 72 L 32 88 M 50 68 L 55 88 M 58 63 L 70 85" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>

        <svg class="unicorn-runner u7" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 Q 45 50 25 70 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 25 90 M 38 72 L 42 90 M 50 68 L 48 90 M 58 63 L 65 90" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>

        <svg class="unicorn-runner u8" viewBox="0 0 100 100">
            <path d="M 20 60 C 20 45, 35 40, 50 45 C 60 35, 65 25, 75 25 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <polygon points="75,25 82,5 78,22" fill="#ffd700" stroke="#2b2b2b" stroke-width="1.5"/>
            <path d="M 45 48 C 30 15, 10 15, 20 38 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            <circle cx="78" cy="33" r="2" fill="#000000"/>
            <path d="M 30 70 L 20 85 M 38 72 L 32 88 M 50 68 L 55 88 M 58 63 L 70 85" stroke="#2b2b2b" stroke-width="2.5"/>
        </svg>
    </div>

    <div id="spiral-container"></div>

    <div class="book" id="book">
        <div class="page-right">
            <img src="inside.jpg" alt="Запрошення">
        </div>

        <div class="cover-turn">
            <div class="cover-face cover-front">
                <img src="cover.jpg" alt="Обкладинка">
            </div>
            <div class="cover-face cover-back"></div>
        </div>
    </div>

    <div class="hint">Тисни, якщо не лох</div>

    <script>
        const book = document.getElementById('book');
        const spiralContainer = document.getElementById('spiral-container');

        function createSpiralRibbon() {
            const colors = ['#e63946', '#ffb703', '#00b4d8', '#d62828', '#7209b7', '#4361ee', '#f72585'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * 95; 
            const scale = 0.6 + Math.random() * 0.8; 

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 40 250");
            svg.setAttribute("width", (40 * scale).toString());
            svg.setAttribute("height", (250 * scale).toString());
            svg.classList.add("spiral-ribbon");
            svg.style.left = left + "vw";
            svg.style.animationDuration = (3.5 + Math.random() * 2) + "s";

            svg.innerHTML = `
                <path d="M20 0 
                         C 38 20, 38 40, 20 60 
                         C 2 80, 2 100, 20 120 
                         C 38 140, 38 160, 20 180 
                         C 2 200, 2 220, 20 240" 
                      fill="none" 
                      stroke="${color}" 
                      stroke-width="7" 
                      stroke-linecap="round"/>
            `;

            spiralContainer.appendChild(svg);
            setTimeout(() => svg.remove(), 6000);
        }

        function launchSuperEffects() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;

            const spiralInterval = setInterval(() => {
                if (Date.now() > animationEnd) return clearInterval(spiralInterval);
                createSpiralRibbon();
            }, 120);

            const colors = ['#ffffff', '#ffd700', '#ff0055', '#00e5ff', '#ffbe0b', '#8338ec', '#ff70a6'];

            const confettiInterval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(confettiInterval);

                confetti({
                    particleCount: 25,
                    startVelocity: 20,
                    spread: 360,
                    ticks: 200,
                    origin: { x: Math.random(), y: Math.random() * 0.8 },
                    colors: ['#ffffff', '#fff3b0', '#ffd700'],
                    shapes: ['star'],
                    scalar: 0.45,
                    gravity: 0.4,
                    drift: (Math.random() - 0.5) * 1.5
                });

                confetti({
                    particleCount: 20,
                    startVelocity: 45,
                    spread: 100,
                    origin: { x: Math.random(), y: 0.5 },
                    colors: colors,
                    scalar: 1.2,
                    ticks: 250
                });
            }, 80);
        }

        book.addEventListener('click', () => {
            const isOpen = book.classList.toggle('open');
            if (isOpen) {
                launchSuperEffects();
            }
        });
    </script>

</body>
</html>
