<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0e4d7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* КОНТЕЙНЕР ДЛЯ ФОНОВИХ ПЕРСОНАЖІВ */
        .unicorns-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .char-container {
            position: absolute;
            width: 140px;
            height: auto;
        }

        .char-container img.unicorn-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pegasus-wing {
            position: absolute;
            top: 25%;
            left: 35%;
            width: 50px;
            height: 40px;
            z-index: 2;
            transform-origin: bottom right;
            animation: flap 0.6s ease-in-out infinite alternate;
        }

        @keyframes flap {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-20deg); }
        }

        /* АНІМАЦІЇ РУХУ */
        @keyframes runLeftToRight {
            0% { transform: translateX(-200px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-15px); }
            100% { transform: translateX(110vw) translateY(0); }
        }

        @keyframes runRightToLeft {
            0% { transform: translateX(110vw) scaleX(-1) translateY(0); }
            50% { transform: translateX(50vw) scaleX(-1) translateY(-20px); }
            100% { transform: translateX(-200px) scaleX(-1) translateY(0); }
        }

        .u1 { top: 5%; animation: runLeftToRight 7s linear infinite; }
        .u2 { top: 18%; animation: runRightToLeft 9s linear infinite 1s; }
        .u3 { top: 32%; animation: runLeftToRight 8s linear infinite 2.5s; }
        .u4 { top: 45%; animation: runRightToLeft 10s linear infinite 0.5s; }
        .u5 { top: 58%; animation: runLeftToRight 7.5s linear infinite 3s; }
        .u6 { top: 70%; animation: runRightToLeft 9.5s linear infinite 1.8s; }
        .u7 { top: 82%; animation: runLeftToRight 8.5s linear infinite 4s; }
        .u8 { top: 25%; animation: runRightToLeft 11s linear infinite 3.5s; }

        .book {
            position: relative;
            width: min(90vw, 900px);
            aspect-ratio: 2400 / 800;
            perspective: 2000px;
            cursor: pointer;
            transition: transform 0.5s ease;
            z-index: 5;
        }

        .page-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            box-shadow: 5px 15px 35px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }

        .page-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-turn {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            z-index: 10;
        }

        .book.open .cover-turn {
            transform: rotateY(-180deg);
        }

        .cover-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        .cover-front {
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }

        .cover-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-back {
            transform: rotateY(180deg);
            background-color: #ffe7fb;
            box-shadow: -5px 15px 35px rgba(0, 0, 0, 0.15);
        }

        .hint {
            margin-top: 30px;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            text-align: center;
            transition: transform 0.5s ease;
            z-index: 5;
        }

        #spiral-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .spiral-ribbon {
            position: absolute;
            top: -150px;
            animation: fallAndSpin 5s linear forwards;
        }

        @keyframes fallAndSpin {
            0% {
                transform: translateY(0) rotate(0deg) scaleY(0.3);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translateY(15vh) rotate(45deg) scaleY(1);
            }
            100% {
                transform: translateY(115vh) rotate(720deg) scaleY(1.1);
                opacity: 0.2;
            }
        }

        /* МОБІЛЬНА АДАПТАЦІЯ ТА ПОВОРОТ ЕЛЕМЕНТІВ НА 90 ГРАДУСІВ */
        @media (max-width: 768px) and (orientation: portrait) {
            body { 
                padding: 0; 
            }

            .book {
                transform: rotate(90deg);
                width: min(80vh, 550px);
                aspect-ratio: 2400 / 800;
            }

            /* Зсуваємо текст нижче, оскільки повернена листівка займає більше ширини по вертикалі */
            .hint {
                transform: rotate(90deg);
                margin-top: 140px; 
            }

            /* Повертаємо фоновий контейнер з єдинорогами на 90 градусів */
            .unicorns-background {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
                top: calc(50% - 50vw);
                left: calc(50% - 50vh);
            }

            /* Повертаємо контейнер для серпантину */
            #spiral-container {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
                top: calc(50% - 50vw);
                left: calc(50% - 50vh);
            }
        }
    </style>
</head>
<body>

    <div class="unicorns-background">
        <div class="char-container u1">
            <img src="unicorn.png" class="unicorn-img" alt="Unicorn">
        </div>
        <div class="char-container u2">
            <img src="unicorn.png" class="unicorn-img" alt="Pegasus">
            <svg class="pegasus-wing" viewBox="0 0 50 40">
                <path d="M 40 35 C 30 10, 5 5, 15 25 C 20 30, 30 33, 38 35 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            </svg>
        </div>
        <div class="char-container u3">
            <img src="unicorn.png" class="unicorn-img" alt="Unicorn">
        </div>
        <div class="char-container u4">
            <img src="unicorn.png" class="unicorn-img" alt="Pegasus">
            <svg class="pegasus-wing" viewBox="0 0 50 40">
                <path d="M 40 35 C 30 10, 5 5, 15 25 C 20 30, 30 33, 38 35 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            </svg>
        </div>
        <div class="char-container u5">
            <img src="unicorn.png" class="unicorn-img" alt="Unicorn">
        </div>
        <div class="char-container u6">
            <img src="unicorn.png" class="unicorn-img" alt="Pegasus">
            <svg class="pegasus-wing" viewBox="0 0 50 40">
                <path d="M 40 35 C 30 10, 5 5, 15 25 C 20 30, 30 33, 38 35 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            </svg>
        </div>
        <div class="char-container u7">
            <img src="unicorn.png" class="unicorn-img" alt="Unicorn">
        </div>
        <div class="char-container u8">
            <img src="unicorn.png" class="unicorn-img" alt="Pegasus">
            <svg class="pegasus-wing" viewBox="0 0 50 40">
                <path d="M 40 35 C 30 10, 5 5, 15 25 C 20 30, 30 33, 38 35 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <div id="spiral-container"></div>

    <div class="book" id="book">
        <div class="page-right">
            <img src="inside.jpg" alt="Запрошення">
        </div>

        <div class="cover-turn">
            <div class="cover-face cover-front">
                <img src="cover.jpg" alt="Обкладинка">
            </div>
            <div class="cover-face cover-back"></div>
        </div>
    </div>

    <div class="hint">Тисни, якщо не лох</div>

    <script>
        const book = document.getElementById('book');
        const spiralContainer = document.getElementById('spiral-container');

        function createSpiralRibbon() {
            const colors = ['#e63946', '#ffb703', '#00b4d8', '#d62828', '#7209b7', '#4361ee', '#f72585'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * 95; 
            const scale = 0.6 + Math.random() * 0.8; 

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 40 250");
            svg.setAttribute("width", (40 * scale).toString());
            svg.setAttribute("height", (250 * scale).toString());
            svg.classList.add("spiral-ribbon");
            svg.style.left = left + "vw";
            svg.style.animationDuration = (3.5 + Math.random() * 2) + "s";

            svg.innerHTML = `
                <path d="M20 0 
                         C 38 20, 38 40, 20 60 
                         C 2 80, 2 100, 20 120 
                         C 38 140, 38 160, 20 180 
                         C 2 200, 2 220, 20 240" 
                      fill="none" 
                      stroke="${color}" 
                      stroke-width="7" 
                      stroke-linecap="round"/>
            `;

            spiralContainer.appendChild(svg);
            setTimeout(() => svg.remove(), 6000);
        }

        function launchSuperEffects() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;

            const spiralInterval = setInterval(() => {
                if (Date.now() > animationEnd) return clearInterval(spiralInterval);
                createSpiralRibbon();
            }, 120);

            const colors = ['#ffffff', '#ffd700', '#ff0055', '#00e5ff', '#ffbe0b', '#8338ec', '#ff70a6'];

            const confettiInterval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(confettiInterval);

                confetti({
                    particleCount: 25,
                    startVelocity: 20,
                    spread: 360,
                    ticks: 200,
                    origin: { x: Math.random(), y: Math.random() * 0.8 },
                    colors: ['#ffffff', '#fff3b0', '#ffd700'],
                    shapes: ['star'],
                    scalar: 0.45,
                    gravity: 0.4,
                    drift: (Math.random() - 0.5) * 1.5
                });

                confetti({
                    particleCount: 20,
                    startVelocity: 45,
                    spread: 100,
                    origin: { x: Math.random(), y: 0.5 },
                    colors: colors,
                    scalar: 1.2,
                    ticks: 250
                });
            }, 80);
        }

        book.addEventListener('click', () => {
            const isOpen = book.classList.toggle('open');
            if (isOpen) {
                launchSuperEffects();
            }
        });
    </script>

</body>
</html>
